
<div class="page-container">

  <div class="form-card">

    <div class="form-header">
      <h1>Add Food Item</h1>
      <p>Enter the details to add a new food item to your menu.</p>
    </div>

    <form [formGroup]="foodForm" (ngSubmit)="submitFoodItem()">

      <div class="form-group">
        <label for="name">Food Name *</label>

        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter food name">

        <small class="validation-error"
          *ngIf="formControls.name.touched && formControls.name.hasError('required')">
          Food name is required.
        </small>

        <small class="validation-error"
          *ngIf="formControls.name.touched && formControls.name.hasError('maxlength')">
          Food name cannot exceed 100 characters.
        </small>
      </div>

      <div class="form-group">
        <label for="category">Category *</label>

        <select id="category" formControlName="category">
          <option value="">Select category</option>
          <option value="Snacks">Snacks</option>
          <option value="Meals">Meals</option>
          <option value="Drinks">Drinks</option>
          <option value="Desserts">Desserts</option>
        </select>

        <small class="validation-error"
          *ngIf="formControls.category.touched && formControls.category.invalid">
          Please select a category.
        </small>
      </div>

      <div class="form-group">
        <label for="description">Description</label>

        <textarea
          id="description"
          rows="4"
          formControlName="description"
          placeholder="Enter food description">
        </textarea>
      </div>

      <div class="form-group">
        <label for="price">Price (₹) *</label>

        <input
          id="price"
          type="number"
          min="0.01"
          step="0.01"
          formControlName="price"
          placeholder="Enter price">

        <small class="validation-error"
          *ngIf="formControls.price.touched && formControls.price.hasError('required')">
          Price is required.
        </small>

        <small class="validation-error"
          *ngIf="formControls.price.touched && formControls.price.hasError('min')">
          Price must be greater than zero.
        </small>
      </div>

      <div class="availability-group">
        <input
          id="isAvailable"
          type="checkbox"
          formControlName="isAvailable">

        <label for="isAvailable">Food item is available</label>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="submit-btn"
          [disabled]="loading">

          {{ loading ? 'Saving...' : 'Add Food Item' }}

        </button>

        <a routerLink="/food-items" class="cancel-btn">
          Cancel
        </a>
      </div>

    </form>

  </div>

</div>
