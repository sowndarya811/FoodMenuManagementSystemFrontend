
<div class="form-page">

  <div class="form-card">

    <h1>Edit Category</h1>
    <p class="subtitle">Update your food category details</p>

    <div *ngIf="loading" class="info-message">
      Loading category...
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form
      *ngIf="!loading"
      [formGroup]="categoryForm"
      (ngSubmit)="updateCategory()">

      <div class="form-group">
        <label>Category Name *</label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter category name">

        <small class="validation"
          *ngIf="categoryForm.controls.name.touched &&
                 categoryForm.controls.name.hasError('required')">
          Category name is required.
        </small>

        <small class="validation"
          *ngIf="categoryForm.controls.name.touched &&
                 categoryForm.controls.name.hasError('minlength')">
          Minimum 2 characters required.
        </small>

        <small class="validation"
          *ngIf="categoryForm.controls.name.touched &&
                 categoryForm.controls.name.hasError('maxlength')">
          Maximum 100 characters allowed.
        </small>
      </div>

      <div class="form-group">
        <label>Description</label>

        <textarea
          formControlName="description"
          rows="4"
          placeholder="Enter category description">
        </textarea>
      </div>

      <div class="form-group">
        <label>Category Status</label>

        <select formControlName="isActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="saving">
          {{ saving ? 'Updating...' : 'Update Category' }}
        </button>

        <a routerLink="/categories" class="cancel-btn">
          Cancel
        </a>
      </div>

    </form>

  </div>

</div>
